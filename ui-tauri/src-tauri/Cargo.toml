[package]
name = "mechrevo-control-gui"
version = "0.4.0"
description = "Tauri 2 desktop control center for MECHREVO Linux Control"
authors = ["CyberNova"]
license = "AGPL-3.0-only"
edition = "2021"

[[bin]]
name = "mechrevo-control-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1.45", features = ["rt", "time", "process", "net", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
