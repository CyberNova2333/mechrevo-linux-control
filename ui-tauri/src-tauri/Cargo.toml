[package]
name = "mechrevo-control-gui"
version = "0.4.0"
description = "Tauri 2 desktop control center for MECHREVO Linux Control"
authors = ["CyberNova"]
license = "AGPL-3.0-only"
edition = "2021"

[[bin]]
name = "mechrevo-control-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
iteglow-watercooling-config = { path = "../../watercooling-daemon/config" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1.45", features = ["rt", "time", "process", "net", "io-util"] }

[patch.crates-io]
# GTK 3 needs glib 0.18. Pin the two-line RUSTSEC-2024-0429 backport in gtk-rs/gtk-rs-core#2022.
glib = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "9f33e4a43e4189ddb56101992c8d78a38fb999e4" }
# All GTK bindings must share the same FFI types as the patched glib crate.
gio-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "9f33e4a43e4189ddb56101992c8d78a38fb999e4" }
glib-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "9f33e4a43e4189ddb56101992c8d78a38fb999e4" }
gobject-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "9f33e4a43e4189ddb56101992c8d78a38fb999e4" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
