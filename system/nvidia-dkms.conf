# DKMS per-module override for NVIDIA open kernel modules (/etc/dkms/nvidia.conf).
# Runs the idempotent hibernate-shutdown source patch inside DKMS's temporary build directory
# before compilation on both kernel updates and nvidia-dkms driver upgrades.
for _mechrevo_idx in "${!MAKE[@]}"; do
    case "${MAKE[$_mechrevo_idx]}" in
        *mechrevo-nvidia-hibernate-patch*)
            ;;
        *';'*)
            _mechrevo_prefix=${MAKE[$_mechrevo_idx]%;*}
            _mechrevo_suffix=${MAKE[$_mechrevo_idx]##*;}
            _mechrevo_suffix=${_mechrevo_suffix#${_mechrevo_suffix%%[![:space:]]*}}
            MAKE[$_mechrevo_idx]="${_mechrevo_prefix}; /usr/local/libexec/mechrevo-nvidia-hibernate-patch --apply && ${_mechrevo_suffix}"
            ;;
        *)
            MAKE[$_mechrevo_idx]="/usr/local/libexec/mechrevo-nvidia-hibernate-patch --apply && ${MAKE[$_mechrevo_idx]}"
            ;;
    esac
done
