name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      compileall_only:
        description: '仅执行 Python 字节码语法检查（跳过 apt 安装 GTK4 与 xvfb 单测）'
        required: false
        type: boolean
        default: false
      skip_packaging:
        description: '跳过 .deb / .rpm / .AppImage 发行包冒烟构建'
        required: false
        type: boolean
        default: false
      test_pattern:
        description: '可选：传给 Python unittest -k 的测试筛选关键字'
        required: false
        type: string
        default: ''

env:
  PNPM_VERSION: '12.22.0'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.release_version && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-ui:
    name: Rust 全栈测试、Clippy 与 Vue 前端构建
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备测试版本
        if: ${{ inputs.release_version != '' }}
        env:
          VERSION: ${{ inputs.release_version }}
        run: python3 .github/scripts/prepare-release.py "$VERSION"

      - name: 安装 Tauri 2 / WebKit2GTK 系统开发依赖与 ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            shellcheck

      - name: 安装 Rust 稳定工具链与 Clippy
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: clippy

      - name: 缓存 Rust 依赖与编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            watercooling-daemon
            session-daemon
            system-daemon
            iteglow-cli
            ui-tauri/src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: ui-tauri/package.json

      - name: 安装 Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: 检查 SPDX 协议头与 Shell 脚本规范
        run: |
          set -euo pipefail
          MISSING=0
          while IFS= read -r -d '' file; do
            if ! head -n 3 "$file" | grep -q 'SPDX-License-Identifier: AGPL-3.0-only'; then
              echo "error: missing AGPL-3.0-only SPDX header: $file" >&2
              MISSING=1
            fi
          done < <(find watercooling-daemon/src session-daemon/src system-daemon/src iteglow-cli/src ui-tauri/src ui-tauri/src-tauri/src packaging \
            -type f \( -name '*.rs' -o -name '*.ts' -o -name '*.vue' -o -name '*.css' -o -name '*.sh' -o -name '*.mjs' \) -print0)
          test "$MISSING" -eq 0

          shellcheck packaging/*.sh .github/scripts/verify-packages.sh
          shopt -s nullglob
          sh_files=(system/*.sh)
          if [ "${#sh_files[@]}" -gt 0 ]; then
            shellcheck "${sh_files[@]}"
          fi

      - name: 内核租约离线故障注入测试
        run: python3 system/mechrevo-turbo-driver/test_core.py

      - name: Vue 3 + Naive UI 前端类型检查与生产构建
        working-directory: ui-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Rust 单元测试（全部 5 个 Crate）
        run: |
          set -euo pipefail
          for crate in watercooling-daemon session-daemon system-daemon iteglow-cli ui-tauri/src-tauri; do
            echo "==> cargo test ($crate)"
            (cd "$crate" && cargo test --locked)
          done

      - name: Rust Clippy 严格静态检查（全部 5 个 Crate）
        run: |
          set -euo pipefail
          for crate in watercooling-daemon session-daemon system-daemon iteglow-cli ui-tauri/src-tauri; do
            echo "==> cargo clippy ($crate)"
            (cd "$crate" && cargo clippy --locked --all-targets -- -D warnings)
          done

  python-legacy-checks:
    name: 历史 Python 原型与兼容性单测
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 GTK4 与 USB Python 运行时依赖
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.compileall_only) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 python3-usb xvfb xauth

      - name: 字节码语法检查
        run: /usr/bin/python3 -B -m compileall -q iteglow/src tests

      - name: 运行单元测试
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.compileall_only) }}
        env:
          TEST_PATTERN: ${{ github.event_name == 'workflow_dispatch' && inputs.test_pattern || '' }}
        run: |
          if [ -n "$TEST_PATTERN" ]; then
            PYTHONPATH=iteglow/src GSK_RENDERER=cairo xvfb-run -a /usr/bin/python3 -B -m unittest discover -s tests -k "$TEST_PATTERN" -v
          else
            PYTHONPATH=iteglow/src GSK_RENDERER=cairo xvfb-run -a /usr/bin/python3 -B -m unittest discover -s tests -v
          fi

  package-smoke:
    name: 多格式发行包构建冒烟测试 (.deb / .rpm / .AppImage)
    runs-on: ubuntu-24.04
    needs: [rust-and-ui]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_packaging) }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      UI_CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备打包版本
        id: meta
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/prepare-release.py "$VERSION")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 安装 Tauri 2 与多格式打包工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            rpm \
            squashfs-tools \
            dpkg-dev \
            fakeroot \
            file

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable

      - name: 缓存 Rust 依赖与编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            watercooling-daemon -> ../target
            session-daemon -> ../target
            system-daemon -> ../target
            iteglow-cli -> ../target
            ui-tauri/src-tauri -> ../../target

      - name: 安装 pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: ui-tauri/package.json

      - name: 安装 Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: 构建 .deb / .rpm / .AppImage 与 system-daemon 伴侣归档
        env:
          STRICT_ALL: '1'
          FETCH_APPIMAGE_RUNTIME: '1'
          BUILD_SYSTEM_BUNDLE: '1'
        run: ./packaging/build-packages.sh

      - name: 校验产物校验和与零 Python 依赖约束
        working-directory: dist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash ../.github/scripts/verify-packages.sh "$VERSION"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 CI 预览构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-packages-linux-x86_64
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 14
