name: 构建与发版

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '本次发布版本，例如 1.0.0 或 v1.0.0；留空使用所选 Git 标签或清单版本'
        required: false
        type: string
        default: ''
      prerelease:
        description: '标记为 Pre-release，预发布版本如 1.0.0-rc.1 会自动启用'
        required: false
        type: boolean
        default: false
      draft:
        description: '以草稿形式创建 GitHub Release'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '演练模式：仅构建与校验产物，不发布 GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  metadata:
    name: 确定发行标签与构建提交
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          MARK_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          requested="$INPUT_TAG"
          if [[ "$GITHUB_REF_TYPE" == tag && -z "$requested" ]]; then
            requested="$GITHUB_REF_NAME"
          fi
          version="$(python3 .github/scripts/prepare-release.py --print-only "$requested")"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$tag" != "v${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::The requested version differs from the selected tag ref."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag" &&
             [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag $tag already points to another commit. Select that tag as the workflow ref to rebuild it."
            exit 1
          fi
          prerelease=false
          if [[ "${version%%+*}" == *-* || "$MARK_PRERELEASE" == true ]]; then
            prerelease=true
          fi
          printf 'version=%s\ntag=%s\nis_prerelease=%s\n' "$version" "$tag" "$prerelease" >> "$GITHUB_OUTPUT"
          printf '发行标签 %s，构建提交 %s\n' "$tag" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 验证与打包
    needs: metadata
    uses: ./.github/workflows/checks.yml
    with:
      release_version: ${{ needs.metadata.outputs.version }}

  publish-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-24.04
    needs: [metadata, build]
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    concurrency:
      group: publish-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: 检出本次构建提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 下载构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-packages-linux-x86_64
          path: dist

      - name: 重新校验 SHA256SUMS 并生成发布说明
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          ASSET_VERSION="${VERSION/+/_}"
          SHA_TABLE="$(cat dist/SHA256SUMS)"

          cat > release-notes.md <<EOF
          ## MECHREVO Linux Control ${TAG}

          面向机械革命 **YAOSHI Series (\`XxAF55xx\` / BIOS \`N.1.33MRO91\`)** 的原生 Rust + Tauri 2 (Vue 3 / Naive UI) Linux 硬件控制中心、外置蓝牙水冷控制栈与 EC/WMI 性能调校套件。

          ### 发行包说明（Linux x86_64 · 零 Python 运行时依赖）

          | 产物文件 | 适用场景 | 包含内容 |
          | :--- | :--- | :--- |
          | \`iteglow-control_${ASSET_VERSION}_amd64.deb\` | Debian / Ubuntu 24.04+ | \`mechrevo-control-gui\`、\`iteglow\` CLI、用户级 Rust 守护（水冷 + 会话灯光）、udev 规则与桌面入口 |
          | \`iteglow-control-${ASSET_VERSION}-1.x86_64.rpm\` | Fedora / RHEL / openSUSE | 同上（RPM 打包格式） |
          | \`iteglow-control-${ASSET_VERSION}-x86_64.AppImage\` | 跨发行版免安装便携包 | 同上（Type-2 zstd AppImage，内置 CLI / GUI / 守护入口） |
          | \`mechrevo-system-daemon-${ASSET_VERSION}-linux-x86_64.tar.gz\` | 本机实测机型 Root 系统套件 | 全部 8 个原生 Rust 系统助手/守护、6 份 systemd 单元与 Polkit 策略（不含针对特定内核版本的 \`.ko\` 模块） |

          ### 快速安装与校验

          \`\`\`bash
          # 1. 校验下载文件完整性
          sha256sum -c SHA256SUMS

          # 2. Debian / Ubuntu 安装桌面端、CLI 与用户级守护
          sudo apt install ./iteglow-control_${ASSET_VERSION}_amd64.deb
          systemctl --user daemon-reload
          systemctl --user enable --now iteglow-watercooling.service iteglow-session-restore.service

          # 3. 或直接运行便携 AppImage
          chmod +x iteglow-control-${ASSET_VERSION}-x86_64.AppImage
          ./iteglow-control-${ASSET_VERSION}-x86_64.AppImage
          \`\`\`

          > **硬件安全提示**：\`mechrevo-system-daemon\` 伴侣归档中的 EC 调校与狂暴租约组件严格受限于主板 DMI / BIOS 白名单与 \`EC 0x7A5\` 高温保护门禁；请务必先查阅仓库内 \`system/mechrevo-turbo-backend.md\` 与 \`system/mechrevo-custom-gpu-backend.md\` 后再部署系统级单元。

          ### SHA-256 校验和

          \`\`\`text
          ${SHA_TABLE}
          \`\`\`

          ---
          Licensed under **GNU AGPL-3.0-only** with Additional Terms (\`LICENSE-ADDITIONAL_TERMS-zh-CN.md\`).
          EOF

          {
            echo "### Release Summary (${TAG})"
            echo ""
            echo "- **Version**: \`${VERSION}\`"
            echo "- **Prerelease**: \`${{ needs.metadata.outputs.is_prerelease }}\`"
            echo ""
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          IS_PRE: ${{ needs.metadata.outputs.is_prerelease }}
          IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          ref="refs/tags/$TAG"
          remote_ref="$(git ls-remote --refs origin "$ref")"
          if [[ -z "$remote_ref" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$commit" > /dev/null
          fi
          git fetch --quiet --no-tags origin "$ref"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$commit" ]]; then
            echo "::error::Tag $TAG no longer points to the built commit $commit"
            exit 1
          fi

          flags=(--title "MECHREVO Linux Control ${TAG}" --notes-file release-notes.md
                 "--prerelease=$IS_PRE" "--draft=$IS_DRAFT" --target "$commit" --verify-tag)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
