name: 构建与发版

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '留空自动使用当前清单版本；手动填写时须与清单一致，可带 v 前缀'
        required: false
        type: string
        default: ''
      prerelease:
        description: '标记为 Pre-release（若标签包含连字符 - 则自动启用）'
        required: false
        type: boolean
        default: false
      draft:
        description: '以草稿形式创建 GitHub Release'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '演练模式：仅构建与校验产物，不发布 GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 发版前全栈校验与版本核对
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 核对 7 份清单版本与发版标签一致性
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' watercooling-daemon/Cargo.toml | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "error: unable to read version from watercooling-daemon/Cargo.toml" >&2
            exit 1
          fi

          for f in watercooling-daemon/Cargo.toml session-daemon/Cargo.toml system-daemon/Cargo.toml iteglow-cli/Cargo.toml ui-tauri/src-tauri/Cargo.toml; do
            V="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$f" | head -n 1)"
            if [ "$V" != "$VERSION" ]; then
              echo "error: version mismatch in $f ($V != $VERSION)" >&2
              exit 1
            fi
          done
          for f in ui-tauri/package.json ui-tauri/src-tauri/tauri.conf.json; do
            V="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -n 1)"
            if [ "$V" != "$VERSION" ]; then
              echo "error: version mismatch in $f ($V != $VERSION)" >&2
              exit 1
            fi
          done

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
            DRY_RUN="false"
          else
            TAG="${INPUT_TAG:-$VERSION}"
            TAG="v${TAG#v}"
            DRY_RUN="${INPUT_DRY_RUN:-true}"
          fi

          EXPECTED_TAG="v${VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "error: release tag '$TAG' does not match '$EXPECTED_TAG'. For a manual run, leave the tag blank to use the manifest version." >&2
            exit 1
          fi

          IS_PRE="false"
          if [ "${INPUT_PRERELEASE:-false}" = "true" ] || [[ "$TAG" == *-* ]]; then
            IS_PRE="true"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Verified release tag=$TAG version=$VERSION prerelease=$IS_PRE dry_run=$DRY_RUN"

      - name: 安装系统开发依赖、ShellCheck 与历史单测运行环境
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            shellcheck \
            python3-gi \
            gir1.2-gtk-4.0 \
            python3-usb \
            xvfb \
            xauth

      - name: 安装 Rust 稳定工具链与 Clippy
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: clippy

      - name: 缓存 Rust 依赖与编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            watercooling-daemon
            session-daemon
            system-daemon
            iteglow-cli
            ui-tauri/src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - name: 安装 Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: SPDX 协议头与 ShellCheck 校验
        run: |
          set -euo pipefail
          MISSING=0
          while IFS= read -r -d '' file; do
            if ! head -n 3 "$file" | grep -q 'SPDX-License-Identifier: AGPL-3.0-only'; then
              echo "error: missing AGPL-3.0-only SPDX header: $file" >&2
              MISSING=1
            fi
          done < <(find watercooling-daemon/src session-daemon/src system-daemon/src iteglow-cli/src ui-tauri/src ui-tauri/src-tauri/src packaging \
            -type f \( -name '*.rs' -o -name '*.ts' -o -name '*.vue' -o -name '*.css' -o -name '*.sh' \) -print0)
          test "$MISSING" -eq 0
          shellcheck packaging/build-packages.sh .github/scripts/verify-packages.sh

      - name: Vue 3 + Naive UI 前端构建校验
        working-directory: ui-tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Rust 全量单元测试与 Clippy 严格门禁
        run: |
          set -euo pipefail
          for crate in watercooling-daemon session-daemon system-daemon iteglow-cli ui-tauri/src-tauri; do
            echo "==> testing & linting $crate"
            (cd "$crate" && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings)
          done

      - name: 历史 Python 兼容性单元测试
        run: |
          /usr/bin/python3 -B -m compileall -q iteglow/src tests
          PYTHONPATH=iteglow/src GSK_RENDERER=cairo xvfb-run -a /usr/bin/python3 -B -m unittest discover -s tests -v

  build-artifacts:
    name: 构建 Linux 发行包 (.deb / .rpm / .AppImage / system-daemon)
    runs-on: ubuntu-24.04
    needs: [verify]
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 安装 Tauri 2 与多格式打包工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            rpm \
            squashfs-tools \
            dpkg-dev \
            fakeroot \
            file

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable

      - name: 缓存 Rust 依赖与编译产物
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            watercooling-daemon
            session-daemon
            system-daemon
            iteglow-cli
            ui-tauri/src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - name: 安装 Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui-tauri/pnpm-lock.yaml

      - name: 执行多格式发行包构建
        env:
          STRICT_ALL: '1'
          FETCH_APPIMAGE_RUNTIME: '1'
          BUILD_SYSTEM_BUNDLE: '1'
        run: ./packaging/build-packages.sh

      - name: 核对产物完整性与零 Python 依赖
        working-directory: dist
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash ../.github/scripts/verify-packages.sh "$VERSION"

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist-${{ needs.verify.outputs.version }}
          path: dist/
          retention-days: 14

  publish-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-24.04
    needs: [verify, build-artifacts]
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: 检出仓库（用于生成变更日志上下文）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist-${{ needs.verify.outputs.version }}
          path: dist

      - name: 重新校验 SHA256SUMS 并生成发布说明
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          SHA_TABLE="$(cat dist/SHA256SUMS)"

          cat > release-notes.md <<EOF
          ## MECHREVO Linux Control ${TAG}

          面向机械革命 **YAOSHI Series (\`XxAF55xx\` / BIOS \`N.1.33MRO91\`)** 的原生 Rust + Tauri 2 (Vue 3 / Naive UI) Linux 硬件控制中心、外置蓝牙水冷控制栈与 EC/WMI 性能调校套件。

          ### 发行包说明（Linux x86_64 · 零 Python 运行时依赖）

          | 产物文件 | 适用场景 | 包含内容 |
          | :--- | :--- | :--- |
          | \`iteglow-control_${VERSION}_amd64.deb\` | Debian / Ubuntu 24.04+ | \`mechrevo-control-gui\`、\`iteglow\` CLI、用户级 Rust 守护（水冷 + 会话灯光）、udev 规则与桌面入口 |
          | \`iteglow-control-${VERSION}-1.x86_64.rpm\` | Fedora / RHEL / openSUSE | 同上（RPM 打包格式） |
          | \`iteglow-control-${VERSION}-x86_64.AppImage\` | 跨发行版免安装便携包 | 同上（Type-2 zstd AppImage，内置 CLI / GUI / 守护入口） |
          | \`mechrevo-system-daemon-${VERSION}-linux-x86_64.tar.gz\` | 本机实测机型 Root 系统套件 | 全部 8 个原生 Rust 系统助手/守护、6 份 systemd 单元与 Polkit 策略（不含针对特定内核版本的 \`.ko\` 模块） |

          ### 快速安装与校验

          \`\`\`bash
          # 1. 校验下载文件完整性
          sha256sum -c SHA256SUMS

          # 2. Debian / Ubuntu 安装桌面端、CLI 与用户级守护
          sudo apt install ./iteglow-control_${VERSION}_amd64.deb
          systemctl --user daemon-reload
          systemctl --user enable --now iteglow-watercooling.service iteglow-session-restore.service

          # 3. 或直接运行便携 AppImage
          chmod +x iteglow-control-${VERSION}-x86_64.AppImage
          ./iteglow-control-${VERSION}-x86_64.AppImage
          \`\`\`

          > **硬件安全提示**：\`mechrevo-system-daemon\` 伴侣归档中的 EC 调校与狂暴租约组件严格受限于主板 DMI / BIOS 白名单与 \`EC 0x7A5\` 高温保护门禁；请务必先查阅仓库内 \`system/mechrevo-turbo-backend.md\` 与 \`system/mechrevo-custom-gpu-backend.md\` 后再部署系统级单元。

          ### SHA-256 校验和

          \`\`\`text
          ${SHA_TABLE}
          \`\`\`

          ---
          Licensed under **GNU AGPL-3.0-only** with Additional Terms (\`LICENSE-ADDITIONAL_TERMS-zh-CN.md\`).
          EOF

          {
            echo "### Release Summary (${TAG})"
            echo ""
            echo "- **Version**: \`${VERSION}\`"
            echo "- **Dry Run**: \`${{ needs.verify.outputs.dry_run }}\`"
            echo "- **Prerelease**: \`${{ needs.verify.outputs.is_prerelease }}\`"
            echo ""
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 创建或更新 GitHub Release
        if: ${{ needs.verify.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          IS_PRE: ${{ needs.verify.outputs.is_prerelease }}
          IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          if [ "$IS_PRE" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            EXTRA_FLAGS+=(--draft)
          fi

          BUILD_COMMIT="$(git rev-parse HEAD)"
          if TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")" && [ "$TAG_COMMIT" != "$BUILD_COMMIT" ]; then
            echo "error: $TAG points to $TAG_COMMIT, but the packages were built from $BUILD_COMMIT" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "==> Updating existing GitHub Release $TAG"
            gh release edit "$TAG" --title "MECHREVO Linux Control ${TAG}" --notes-file release-notes.md "${EXTRA_FLAGS[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            echo "==> Creating GitHub Release $TAG"
            gh release create "$TAG" dist/* \
              --target "$BUILD_COMMIT" \
              --title "MECHREVO Linux Control ${TAG}" \
              --notes-file release-notes.md \
              "${EXTRA_FLAGS[@]}"
          fi
