.sync-assets-licenses: &sync-assets-licenses
  name: 检查并增量同步 ASSETS_LICENSES.md（默认停用）
  image: python:3.12-bookworm
  if: '[ "${ENABLE_MANIFEST_SYNC:-false}" = "true" ]'
  script: |
    set -eu
    export MIRROR_WEB_ENDPOINT="${CNB_WEB_ENDPOINT:-}"
    export MIRROR_REPO_SLUG="${CNB_REPO_SLUG:-}"
    export MIRROR_TOKEN_USER="${CNB_TOKEN_USER_NAME:-cnb}"
    export MIRROR_TOKEN="${CNB_TOKEN:-}"
    export MIRROR_BRANCH="${CNB_BRANCH:-main}"
    export MIRROR_REF_TYPE="${CNB_REF_TYPE:-}"
    export MIRROR_COMMITTER_NAME="cnb"
    export MIRROR_COMMITTER_EMAIL="noreply""@cnb.""local"
    export MIRROR_NOREPLY_DOMAIN="cnb."
    python3 .github/scripts/sync_assets_licenses.py mirror

.check-code: &check-code
  name: 语法与单元测试
  script: |
    set -eu
    DEBIAN_FRONTEND=noninteractive apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 python3-usb xvfb xauth
    /usr/bin/python3 -B -m compileall -q iteglow/src tests
    id -u ci >/dev/null 2>&1 || useradd -m -s /bin/sh ci
    run_dir=$(mktemp -d /tmp/xdg-runtime.XXXXXX)
    home_dir=$(mktemp -d /tmp/ci-home.XXXXXX)
    chown ci:ci "$run_dir" "$home_dir"
    chmod 700 "$run_dir" "$home_dir"
    trap 'rm -rf "$run_dir" "$home_dir"' EXIT
    su -s /bin/sh ci -c "env HOME='$home_dir' XDG_RUNTIME_DIR='$run_dir' PYTHONPATH=iteglow/src GSK_RENDERER=cairo xvfb-run -a /usr/bin/python3 -B -m unittest discover -s tests -v"

$:
  web_trigger_check:
    - name: 手动构建检查（不发布）
      docker:
        image: debian:trixie
      lock:
        key: checks_manual
        wait: true
        cancel-in-wait: true
      stages:
        - *check-code

  web_trigger_assets_licenses:
    - name: 手动校验并增量同步 ASSETS_LICENSES.md
      docker:
        image: python:3.12-bookworm
      env:
        ENABLE_MANIFEST_SYNC: "true"
      lock:
        key: assets_licenses_manual
        wait: true
        cancel-in-wait: true
      stages:
        - *sync-assets-licenses
